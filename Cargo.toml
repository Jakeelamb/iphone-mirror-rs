[package]
name = "iphone-mirror-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "A native Rust iPhone mirror with measured low-latency video and input"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec"] }
flate2 = "1"
libc = "0.2"
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "d32c8189c51c2789496b0768039419c3705498c3", default-features = false, features = ["ring", "usbmuxd", "tcp", "tunnel_tcp_stack", "core_device_proxy", "remote_pairing", "display_stream", "mdns"] }
mdns-sd = "0.17"
plist = "1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v3", "v4"] }
wgpu = { version = "25", default-features = false, features = ["vulkan", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[dev-dependencies]
naga = { version = "25", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
